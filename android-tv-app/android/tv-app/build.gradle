plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

def releaseStoreFile = project.findProperty("TV_APP_RELEASE_STORE_FILE") ?: System.getenv("TV_APP_RELEASE_STORE_FILE")
def releaseStorePassword = project.findProperty("TV_APP_RELEASE_STORE_PASSWORD") ?: System.getenv("TV_APP_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = project.findProperty("TV_APP_RELEASE_KEY_ALIAS") ?: System.getenv("TV_APP_RELEASE_KEY_ALIAS")
def releaseKeyPassword = project.findProperty("TV_APP_RELEASE_KEY_PASSWORD") ?: System.getenv("TV_APP_RELEASE_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "com.tvapp.programguide"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.tvapp.programguide"
        minSdkVersion 23
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.2"

        buildConfigField "String", "PROGRAM_GUIDE_API_BASE_URL", "\"${project.findProperty("PROGRAM_GUIDE_API_BASE_URL") ?: "https://tv.bestcams.net/api"}\""
        buildConfigField "String", "KAN_VOD_VPN_MODE", "\"${project.findProperty("KAN_VOD_VPN_MODE") ?: "vpn"}\""
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            } else {
                storeFile file("${System.properties["user.home"]}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
        }
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

tasks.matching { task ->
    def name = task.name.toLowerCase()
    name.contains("release") && (name.startsWith("assemble") || name.startsWith("bundle") || name.startsWith("package"))
}.configureEach {
    doFirst {
        if (!hasReleaseSigning) {
            throw new GradleException("Missing TV app release signing config. Set TV_APP_RELEASE_STORE_FILE, TV_APP_RELEASE_STORE_PASSWORD, TV_APP_RELEASE_KEY_ALIAS, and TV_APP_RELEASE_KEY_PASSWORD.")
        }
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2025.12.00")
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-core"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.4"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4"
    implementation "androidx.tv:tv-material:1.1.0"
    implementation "androidx.media3:media3-exoplayer:1.11.0"
    implementation "androidx.media3:media3-exoplayer-hls:1.11.0"
    implementation "androidx.media3:media3-exoplayer-dash:1.11.0"
    implementation "androidx.media3:media3-ui:1.11.0"
    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    debugImplementation "androidx.compose.ui:ui-tooling"
}
