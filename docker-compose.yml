services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=surfshark
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES:-Israel}
      - TZ=${TZ:-America/New_York}
      - HTTP_CONTROL_SERVER=off
    restart: unless-stopped
    networks:
      - tv-network

  frontend:
    image: vitalyth/tv-app-frontend:latest
    container_name: frontend
    environment:
      - NEXT_PUBLIC_API_BASE=/api
    restart: unless-stopped
    networks:
      - tv-network

  backend:
    image: vitalyth/tv-app-backend:latest
    container_name: backend
    environment:
      - ROOT_PATH=/api
      - BACKEND_CACHE_DIR=/app/cache
      - VOD_DB_PATH=/app/db/vod.db
      - LEGACY_VOD_DB_PATH=/app/legacy-vod-db/kan_vod.db
      - LOCAL_SERIES_DB_PATH=/app/db/local_series.db
      - LOCAL_SERIES_WATCHER_ENABLED=${LOCAL_SERIES_WATCHER_ENABLED:-true}
      - LOCAL_SERIES_WATCH_INTERVAL_SECONDS=${LOCAL_SERIES_WATCH_INTERVAL_SECONDS:-2}
      - VOD_RETRIES=${VOD_RETRIES:-3}
      - VOD_STREAM_BATCH_SIZE=${VOD_STREAM_BATCH_SIZE:-20}
      - LOCAL_VOD_TV_DIR=${LOCAL_VOD_TV_DIR:-/srv/dev-disk-by-uuid-820981dd-db0e-493c-8606-126a8cd10e8f/data/tv}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TMDB_LANGUAGE=${TMDB_LANGUAGE:-he-IL}
    volumes:
      - ${BACKEND_CACHE_DIR:-/DATA/AppData/tv-app/backend-cache}:/app/cache
      - ${VOD_DB_DIR:-${KAN_VOD_DB_DIR:-/DATA/AppData/tv-app/vod-db}}:/app/db
      - ${LEGACY_VOD_DB_DIR:-/DATA/AppData/tv-app/kan-vod-db}:/app/legacy-vod-db:ro
      - ${LOCAL_VOD_TV_DIR:-/srv/dev-disk-by-uuid-820981dd-db0e-493c-8606-126a8cd10e8f/data/tv}:${LOCAL_VOD_TV_DIR:-/srv/dev-disk-by-uuid-820981dd-db0e-493c-8606-126a8cd10e8f/data/tv}:ro
    restart: unless-stopped
    networks:
      - tv-network

  backend-vpn:
    image: vitalyth/tv-app-backend:latest
    container_name: backend-vpn
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      - ROOT_PATH=/api
      - BACKEND_CACHE_DIR=/app/cache
      - VOD_DB_PATH=/app/db/vod.db
      - LEGACY_VOD_DB_PATH=/app/legacy-vod-db/kan_vod.db
      - LOCAL_SERIES_DB_PATH=/app/db/local_series.db
      - VOD_RETRIES=${VOD_RETRIES:-3}
      - VOD_STREAM_BATCH_SIZE=${VOD_STREAM_BATCH_SIZE:-20}
      - LOCAL_VOD_TV_DIR=${LOCAL_VOD_TV_DIR:-/srv/dev-disk-by-uuid-820981dd-db0e-493c-8606-126a8cd10e8f/data/tv}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TMDB_LANGUAGE=${TMDB_LANGUAGE:-he-IL}
    volumes:
      - ${BACKEND_CACHE_DIR:-/DATA/AppData/tv-app/backend-cache}:/app/cache
      - ${VOD_DB_DIR:-${KAN_VOD_DB_DIR:-/DATA/AppData/tv-app/vod-db}}:/app/db
      - ${LEGACY_VOD_DB_DIR:-/DATA/AppData/tv-app/kan-vod-db}:/app/legacy-vod-db:ro
      - ${LOCAL_VOD_TV_DIR:-/srv/dev-disk-by-uuid-820981dd-db0e-493c-8606-126a8cd10e8f/data/tv}:${LOCAL_VOD_TV_DIR:-/srv/dev-disk-by-uuid-820981dd-db0e-493c-8606-126a8cd10e8f/data/tv}:ro
    network_mode: "service:gluetun"
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket, ssl, urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/version', timeout=5); raw = socket.create_connection(('r.il.cdn-redge.media', 443), timeout=5); ssl.create_default_context().wrap_socket(raw, server_hostname='r.il.cdn-redge.media').close()
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 10s

  backend-scheduler:
    image: vitalyth/tv-app-backend:latest
    container_name: backend-scheduler
    command: ["python", "/app/run_scheduler.py"]
    environment:
      - EPG_INTERVAL_SECONDS=${EPG_INTERVAL_SECONDS:-86400}
      - EPG_VOD_ENRICH_INTERVAL_SECONDS=${EPG_VOD_ENRICH_INTERVAL_SECONDS:-10800}
      - EPG_VOD_RECHECK_SECONDS=${EPG_VOD_RECHECK_SECONDS:-21600}
      - EPG_VOD_RECENT_WINDOW_SECONDS=${EPG_VOD_RECENT_WINDOW_SECONDS:-604800}
      - VOD_RECENT_INTERVAL_SECONDS=${VOD_RECENT_INTERVAL_SECONDS:-43200}
      - VOD_SCAN_INTERVAL_SECONDS=${VOD_SCAN_INTERVAL_SECONDS:-28800}
      - VOD_SCAN_LIMIT_PROGRAMS=${VOD_SCAN_LIMIT_PROGRAMS:-0}
      - KAN_VOD_SCAN_LIMIT_PROGRAMS=${KAN_VOD_SCAN_LIMIT_PROGRAMS:-}
      - KESHET_VOD_SCAN_LIMIT_PROGRAMS=${KESHET_VOD_SCAN_LIMIT_PROGRAMS:-}
      - RESHET_VOD_SCAN_LIMIT_PROGRAMS=${RESHET_VOD_SCAN_LIMIT_PROGRAMS:-}
      - C14_VOD_SCAN_LIMIT_PROGRAMS=${C14_VOD_SCAN_LIMIT_PROGRAMS:-}
      - I24_VOD_SCAN_LIMIT_PROGRAMS=${I24_VOD_SCAN_LIMIT_PROGRAMS:-}
      - VOD_DB_MAINTENANCE_INTERVAL_SECONDS=${VOD_DB_MAINTENANCE_INTERVAL_SECONDS:-86400}
      - VOD_METADATA_BACKFILL_LIMIT=${VOD_METADATA_BACKFILL_LIMIT:-80}
      - BACKEND_CACHE_DIR=/app/cache
      - VOD_DB_PATH=/app/db/vod.db
      - LEGACY_VOD_DB_PATH=/app/legacy-vod-db/kan_vod.db
    volumes:
      - ${BACKEND_CACHE_DIR:-/DATA/AppData/tv-app/backend-cache}:/app/cache
      - ${VOD_DB_DIR:-${KAN_VOD_DB_DIR:-/DATA/AppData/tv-app/vod-db}}:/app/db
      - ${LEGACY_VOD_DB_DIR:-/DATA/AppData/tv-app/kan-vod-db}:/app/legacy-vod-db:ro
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - tv-network

  nginx:
    image: vitalyth/tv-app-nginx:latest
    container_name: nginx
    ports:
      - "8001:80"
    volumes:
      - ${NGINX_CACHE_DIR:-/DATA/AppData/tv-app/nginx-cache}:/var/cache/nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      backend-vpn:
        condition: service_healthy
    networks:
      - tv-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - nginx
    networks:
      - tv-network

networks:
  tv-network:
    driver: bridge
